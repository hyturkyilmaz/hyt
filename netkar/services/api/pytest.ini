[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    cluster_global: küme düzeyinde etkisi olan test (rol değiştirir); paylaşılan kümede öteki işçilerden yalıtılır
    exclusive_cpu: süre ve bellek ölçen başarım testi; paylaşılan kümede öteki işçiler beklerken tek başına koşar
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
