[project]
name = "netkar-api"
version = "0.1.0"
description = "NetKar API ve worker (FastAPI, SQLAlchemy 2, PostgreSQL 16 RLS)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "procrastinate>=2.0",
  "httpx>=0.27",
  "openpyxl>=3.1.5",
  "defusedxml>=0.7.1",
  "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
ignore = [
  "S101",   # assert testlerde serbest
  "RUF001", "RUF002", "RUF003",  # Türkçe karakterler bilerek kullanılıyor
  "B008",   # FastAPI Depends varsayılan argüman kalıbı
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "S607", "S608", "E501"]
"migrations/*" = ["E501", "S608"]
"app/api/v1/*.py" = ["E501"]
"app/profit/results.py" = ["RUF009"]  # wire() alan üst verisi yardımcısı

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_unused_ignores = false

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
